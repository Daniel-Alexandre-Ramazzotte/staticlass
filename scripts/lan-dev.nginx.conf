# Roteador de desenvolvimento: uma única porta que decide, pelo User-Agent,
# se quem está acessando vai para o app web (PC/notebook) ou para o app
# mobile (celulares). Gerado para uso com scripts/lan-dev.sh — roda num
# container nginx com --network host, então "127.0.0.1" aqui é o host de
# verdade, não o container.
#
# O mobile é servido como build de produção estático (app/frontend/dist),
# não o servidor de desenvolvimento do Metro: o bundle de dev do Expo
# passa de 18MB sem minificar, o que é inviável no upload de uma conexão
# doméstica atravessando o Tailscale Funnel (leva minutos e qualquer
# requisição decorrente parece travar/"sem resposta do servidor"). O
# build de produção é minificado e fragmentado, bem menor.

map $http_user_agent $lan_router_upstream {
    default        web;
    "~*Mobi"       mobile_static;
}

upstream web {
    server 127.0.0.1:5173;
}

upstream mobile_static {
    server 127.0.0.1:8090;
}

upstream backend_api {
    server 127.0.0.1:5000;
}

gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json application/wasm text/javascript;

# Build estático do mobile (app/frontend/dist), bind-montado em /var/www/mobile.
server {
    listen 8090;
    server_name _;
    root /var/www/mobile;

    location / {
        try_files $uri $uri.html /index.html;
    }
}

server {
    listen 8888;
    server_name _;

    # Mesma origem para as duas frentes: evita hardcodar IP/porta do
    # backend no app mobile (que roda no navegador de quem acessa, não
    # nesta máquina).
    location /api/ {
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$lan_router_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
